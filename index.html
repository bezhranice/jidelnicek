    }).join("");
    return `<div class="tr-active-bar"><button class="btn sm" data-t="back">‹ Zpět</button><span class="tr-clock" id="tr-clock">${clock()}</span><span style="flex:1"></span><button class="btn sm redb" data-t="finish">Dokončit</button></div>
      <div class="field"><label for="tr-name">Název tréninku</label><input class="input" id="tr-name" data-t-in="name" value="${esc(a.nazev || "")}" placeholder="např. Dřep těžký"></div>
      ${exs || `<section class="card"><p class="hint">Přidej první cvik.</p></section>`}
      <button class="btn redb block" data-t="add-ex">+ Přidat cvik</button>
      <div class="field"><label for="tr-note">Poznámka</label><textarea class="input" id="tr-note" rows="2" data-t-in="note" placeholder="Jak ses cítila, technika…">${esc(a.pozn || "")}</textarea></div>
      <button class="btn ghost" data-t="cancel">${a.upravuji ? "Zrušit úpravy" : "Zahodit trénink"}</button>
      <div class="tr-rest" id="tr-rest" hidden></div>`;
  }
  const clock = () => { if (!st.active) return ""; const s = Math.max(0, Math.floor((Date.now() - st.active.start) / 1000)); return `${Math.floor(s / 3600) ? Math.floor(s / 3600) + ":" : ""}${String(Math.floor(s / 60) % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
  function tick() {
    const c = q("#tr-clock"); if (c) c.textContent = clock();
    const r = q("#tr-rest");
    if (r) {
      if (!st.rest) { r.hidden = true; return; }
      const left = Math.round((st.rest.end - Date.now()) / 1000), over = left < 0;
      if (left === 0 && !st.rest.buzzed) { st.rest.buzzed = true; try { navigator.vibrate?.([200, 100, 200]); } catch (e) { /* nic */ } }
      const t = Math.abs(left);
      r.hidden = false; r.className = "tr-rest" + (over ? " over" : "");
      r.innerHTML = `<div><span class="label">${over ? "Pauza přetažená" : "Pauza"}</span><b>${over ? "+" : ""}${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}</b><span class="bar"><span style="width:${over ? 100 : Math.max(0, 100 - left / st.rest.total * 100)}%"></span></span><button class="btn sm" data-t="rest-plus">+30 s</button><button class="btn sm ghost" data-t="rest-stop" aria-label="Zavřít pauzu">×</button></div>`;
    }
  }
  let saveT = null;
  function persist(now) {
    lsSet(LSK(), st.active);
    clearTimeout(saveT);
    const go = () => { if (st.active) st.db.doc("trenink-aktivni/aktualni").set(st.active); };
    if (now) go(); else saveT = setTimeout(go, 1500);
  }
  function newActive(nazev, cviky, extra = {}) {
    st.active = { id: "a" + Date.now().toString(36) + rid().slice(0, 4), start: Date.now(), datum: today(), nazev: nazev || "", cviky: cviky || [], pozn: "", ...extra };
    st.mode = "aktivni"; persist(true); render(); window.scrollTo(0, 0);
  }
  function prefillFrom(e, n) {
    const l = lastFor(e.id);
    const src = l ? l.e.serie.filter(x => !x.neuspech && (x.op > 0 || x.min || x.km)) : [];
    const k = n || src.length || 3;
    return Array.from({ length: k }, (_, j) => { const p = src[j] || src[src.length - 1] || {}; return { kg: p.kg || "", op: p.op || "", r: !!p.r }; });
  }
  async function finish() {
    const a = st.active;
    const cviky = a.cviky.map(e => ({ id: e.id, nazev: e.nazev, serie: e.serie.filter(s => num(s.kg) > 0 || num(s.op) > 0 || num(s.min) > 0 || num(s.km) > 0).map(s => {
      const o = { kg: num(s.kg), op: Math.round(num(s.op)) };
      if (s.rir !== "" && s.rir != null && !isNaN(parseFloat(s.rir))) o.rir = num(s.rir);
      if (s.r) o.r = true; if (num(s.min)) o.min = num(s.min); if (num(s.km)) o.km = num(s.km);
      return o;
    }) })).filter(e => e.serie.length);
    if (!cviky.length) { toast("Trénink je prázdný, není co uložit."); return; }
    const d = new Date(a.start);
    const doc = { datum: a.datum || today(), cas: `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`, nazev: (a.nazev || "").trim() || "Trénink", zdroj: a.zdroj || "app", cviky, trvani: Math.round((Date.now() - a.start) / 60000) };
    if (a.upravuji) { doc.trvani = a.trvani || doc.trvani; doc.cas = a.cas || doc.cas; if (a.lyftaId) doc.lyftaId = a.lyftaId; }
    if (a.pozn) doc.pozn = a.pozn;
    const bw = bwNow(); if (bw) doc.vaha = bw;
    const id = a.upravuji ? a.id : "t" + doc.datum.replace(/-/g, "") + "-" + rid().slice(0, 5);
    // rekordy před uložením
    const before = calc(); const prs = [];
    for (const e of cviky) {
      const cat = catOf(e), key = MOVES[cat] ? cat : e.id;
      const done = [];
      for (const s of e.serie.filter(x => !x.r && x.kg > 0 && x.op > 0)) {
        if (s.kg > bestBefore(key, s.op, done) && (before.series.get(key)?.sessions.length || 0) > 0) prs.push(`${exName(e)} ${n1(s.kg)} × ${s.op}`);
        done.push(s);
      }
    }
    await st.db.doc("trenink/" + id).set(doc);
    st.db.doc("denik/" + doc.datum).update({ datum: doc.datum, trenink: true });
    st.db.doc("trenink-aktivni/aktualni").delete();
    st.active = null; lsSet(LSK(), null); st.rest = null; st.mode = "dnes";
    openSheet({ type: "summary", id, doc, prs: [...new Set(prs)] });
    render();
  }

  /* ----- Statistiky ----- */
  function vStats() {
    const top = seg("statMode", [["rekordy", "Rekordy"], ["progres", "Progres"], ["objem", "Objem"], ["slabiny", "Slabiny"]], st.statMode);
    if (!st.ws.length) return top + `<section class="card"><p class="hint">Až budou tréninky, objeví se tu statistiky.</p></section>`;
    if (st.statMode === "progres") return top + vProgress();
    if (st.statMode === "objem") return top + vVolume();
    if (st.statMode === "slabiny") return top + vWeak();
    return top + vRecords();
  }
  function vRecords() {
    const c = calc(), keys = [...c.series.keys()], ord = k => ({ S: 0, B: 1, D: 2 }[k] ?? 3);
    const groups = [
      ["Soutěžní", keys.filter(k => MOVES[k]).sort((a, b) => ord(a) - ord(b))],
      ["Varianty", keys.filter(k => /-var$/.test(c.series.get(k).cat)).sort((a, b) => c.series.get(a).label.localeCompare(c.series.get(b).label, "cs"))],
      ["Doplňky", keys.filter(k => c.series.get(k).cat === "other").sort((a, b) => c.series.get(a).label.localeCompare(c.series.get(b).label, "cs"))],
    ];
    let h = `<table class="tr-table"><thead><tr><th>Cvik</th>${REPS.map(n => `<th>${n}</th>`).join("")}</tr></thead><tbody>`;
    for (const [t, ks] of groups) {
      if (!ks.length) continue;
      h += `<tr class="g"><td colspan="${REPS.length + 1}">${t}</td></tr>`;
      for (const k of ks) {
        const s = c.series.get(k), best = c.pr.get(k).best;
        h += `<tr data-t="ex-open" data-k="${esc(k)}" style="cursor:pointer"><td>${MOVES[k] ? `<span class="tr-dot" style="background:${COL[k]}"></span>` : ""}${esc(s.label)}</td>${REPS.map(n => {
          const b = best[n]; if (!b) return `<td style="color:var(--dim)">–</td>`;
          return `<td class="${daysBetween(b.date, today()) < 30 ? "fresh" : ""}">${n1(b.kg)}<small>${b.op > n ? "×" + b.op : dm(b.date)}</small></td>`;
        }).join("")}</tr>`;
      }
    }
    return `<section class="card"><div class="row"><h2 class="h2">Rekordy podle opakování</h2></div><p class="hint">Nejtěžší váha, kterou jsi skutečně zvedla aspoň na daný počet opakování. „×4“ = z delší série. Červeně za posledních 30 dní. Klepni na cvik pro detail.</p><div class="tr-scroll">${h}</tbody></table></div></section>`;
  }
  function vProgress() {
    const from = st.ui.progRange === "all" ? "0000" : addDays(today(), st.ui.progRange === "6m" ? -183 : -365);
    let h = `<div class="row">${seg("progReps", [[1, "1+"], [3, "3+"], [5, "5+"]], st.ui.progReps)}${seg("progRange", [["6m", "6 m"], ["1y", "1 rok"], ["all", "Vše"]], st.ui.progRange)}</div>`;
    for (const k of ["S", "B", "D"]) {
      const s = calc().series.get(k); const pts = []; let run = 0;
      if (s) for (const ses of s.sessions) {
        const ok = ses.sets.filter(x => x.op >= st.ui.progReps); if (!ok.length) continue;
        const t = ok.reduce((a, b) => b.kg > a.kg || (b.kg === a.kg && b.op > a.op) ? b : a);
        const pr = t.kg > run; if (pr) run = t.kg;
        if (ses.date >= from) pts.push({ x: parseDs(ses.date).getTime(), y: t.kg, pr, tip: `${dmy(ses.date)}: ${kg(t.kg)} × ${t.op}${t.rir != null ? ", RIR " + t.rir : ""}${pr ? " · rekord" : ""}` });
      }
      const last = pts[pts.length - 1];
      h += `<section class="card"><div class="row"><h2 class="h2"><span class="tr-dot" style="background:${COL[k]}"></span>${MOVE_FULL[k]}</h2><span class="label">${last ? kg(last.y) : ""}</span></div>${lineChart(pts, COL[k], MOVE_FULL[k])}</section>`;
    }
    return h + `<p class="hint">Bod = nejtěžší série z tréninku. Plné kolečko = rekord v tu chvíli.</p>`;
  }
  function vVolume() {
    const N = 12, s0 = addDays(wkStart(today()), -(N - 1) * 7);
    const data = { S: [], B: [], D: [] };
    for (const k in data) for (let i = 0; i < N; i++) data[k].push({ start: addDays(s0, i * 7), a: 0, b: 0 });
    for (const w of st.ws) {
      const i = Math.floor(daysBetween(s0, w.datum) / 7); if (i < 0 || i >= N) continue;
      for (const e of w.cviky || []) {
        const cat = catOf(e); if (cat === "other" || !data[cat[0]]) continue;
        const sets = workSets(e); if (!sets.length) continue;
        const top = Math.max(...sets.map(x => x.kg));
        for (const x of sets) if (x.kg >= top * 0.7) data[cat[0]][i][cat.endsWith("-var") ? "b" : "a"] += st.ui.volMetric === "kg" ? x.kg * x.op : 1;
      }
    }
    const unit = st.ui.volMetric === "kg" ? " kg" : " sérií";
    let h = seg("volMetric", [["kg", "Kilogramy"], ["sets", "Pracovní série"]], st.ui.volMetric);
    for (const k of ["S", "B", "D"]) {
      const wk = data[k].map(x => ({ ...x, a: Math.round(x.a), b: Math.round(x.b) })), cur = wk[N - 1], prev = wk[N - 2];
      const avg = Math.round(wk.slice(N - 5, N - 1).reduce((a, x) => a + x.a + x.b, 0) / 4);
      h += `<section class="card"><div class="row"><h2 class="h2"><span class="tr-dot" style="background:${COL[k]}"></span>${MOVE_FULL[k]}</h2></div>
        <div class="stats"><div><small>Tento týden</small><b>${fmt(cur.a + cur.b)}</b></div><div><small>Minulý</small><b>${fmt(prev.a + prev.b)}</b></div><div><small>Průměr 4 týd.</small><b>${fmt(avg)}</b></div></div>
        ${bars(wk, COL[k], unit)}<div class="tr-legend"><span><span class="tr-dot" style="background:${COL[k]}"></span>soutěžní</span><span><span class="tr-dot" style="background:#4A3B3A"></span>varianty</span></div></section>`;
    }
    return h + `<p class="hint">Počítají se pracovní série (aspoň 70 % nejtěžší série cviku v tréninku), rozcvičky ne.</p>`;
  }
  function vWeak() {
    const n = st.ui.ratioReps, b = k => calc().pr.get(k)?.best[n]?.kg || 0, v = { S: b("S"), B: b("B"), D: b("D") };
    const defs = [["B", "S", .55, .65], ["D", "S", 1.05, 1.25], ["B", "D", .45, .58]];
    let h = `<section class="card"><div class="row"><h2 class="h2">Poměry</h2>${seg("ratioReps", [[1, "1"], [3, "3"], [5, "5"]], n)}</div>`;
    for (const [a, c, lo, hi] of defs) {
      if (!v[a] || !v[c]) { h += `<p class="hint">${MOVE_FULL[a]} ÷ ${MOVE_FULL[c]}: chybí rekord na ${n} op.</p>`; continue; }
      const r = v[a] / v[c], mn = lo - .25, mx = hi + .25, pos = x => Math.max(0, Math.min(100, (x - mn) / (mx - mn) * 100));
      const verdict = r < lo ? `<span class="tr-pill red">${MOVE_FULL[a]} zaostává</span>` : r > hi ? `<span class="tr-pill red">${MOVE_FULL[c]} zaostává</span>` : `<span class="tr-pill ok">V normě</span>`;
      h += `<div class="stack" style="gap:4px"><div class="row"><span>${MOVE_FULL[a]} ÷ ${MOVE_FULL[c]}</span><b>${fmt(r, 2)}</b></div>
        <div class="tr-pbar" style="background:rgba(255,255,255,.05)"><span style="left:${pos(lo)}%;width:${pos(hi) - pos(lo)}%;background:rgba(224,36,43,.25);box-shadow:none"></span><i style="left:${pos(r)}%;width:3px;background:#fff;top:-5px;bottom:-5px"></i></div>
        <div class="row"><small class="hint">obvykle ${fmt(lo, 2)}–${fmt(hi, 2)}</small>${verdict}</div></div>`;
    }
    const bw = bwNow();
    if (bw) h += `<p class="hint">Násobky tělesné hmotnosti (${kg(bw)}): ${["S", "B", "D"].filter(k => v[k]).map(k => `${MOVE_FULL[k]} ${fmt(v[k] / bw, 2)}×`).join(" · ")}</p>`;
    h += `<p class="hint">Rozpětí jsou hrubé vodítko pro ženy v klasickém trojboji, stavba těla je posouvá.</p></section>`;
    const rows = [];
    for (const s of calc().series.values()) {
      const rec = s.sessions.filter(x => daysBetween(x.date, today()) < 56); if (rec.length < 4) continue;
      const ev = calc().pr.get(s.key).events, lp = ev[ev.length - 1];
      rows.push({ s, wk: Math.floor(daysBetween(lp, today()) / 7), lp, n: rec.length });
    }
    rows.sort((a, b) => b.wk - a.wk);
    h += `<section class="card"><h2 class="h2">Stagnace</h2><p class="hint">Cviky z posledních 8 týdnů (aspoň 4×), podle toho, jak dlouho nepadl rekord.</p>${rows.length ? `<div class="tr-scroll"><table class="tr-table"><tbody>${rows.map(r => `<tr><td>${esc(r.s.label)}</td><td>${dm(r.lp)}</td><td>${r.wk >= 6 ? `<span class="tr-pill red">${r.wk} týd.</span>` : r.wk >= 4 ? `<span class="tr-pill">${r.wk} týd.</span>` : `<span class="tr-pill ok">roste</span>`}</td></tr>`).join("")}</tbody></table></div><p class="hint">6+ týdnů bez rekordu = stagnace. Změň počet opakování, variantu nebo frekvenci.</p>` : `<p class="hint">Zatím málo dat.</p>`}</section>`;
    return h;
  }

  /* ----- Soutěž ----- */
  function loadCmp() {
    fetch("srovnani.json", { cache: "no-cache" }).then(r => r.json()).then(j => { st.cmp = j; rerender(); }).catch(() => { st.cmpErr = true; rerender(); });
  }
  const pctBelow = (p, v) => { if (!p || !v) return null; let i = 0; while (i <= 100 && p.p[i] < v) i++; return i; };
  function mine() {
    const s = best1("S"), b = best1("B"), d = best1("D"), t = s && b && d ? s + b + d : 0, bw = bwNow();
    return { s, b, d, t, gl: gl(t, bw), bw };
  }
  function meetsFor(wc, junior) {
    if (!st.cmp) return [];
    return st.cmp.souteze_csst.filter(m => m.vahovka === wc && (m.divize === "Open" || (junior && m.divize === "Juniors" && !/mlad/i.test(m.nazev))));
  }
  const shortMeet = n => n.replace(/ v klasickém silovém trojboji/i, "").replace(/^\d+\.?\s*/, "").replace(/^Otevřen\S* mistrovství České republiky/i, "MČR").replace(/^Akademické mistrovství České republiky/i, "Akademické MČR").replace(/^Mistrovství České republiky/i, "MČR").replace(/^Mistrovství /i, "Přebor ");
  function chase() {
    const me = mine(); if (!me.t || !st.cmp) return "";
    const ms = meetsFor(myWc(), isJunior()).filter(m => /České republiky/.test(m.nazev));
    const m = ms[0]; if (!m) return "";
    const above = m.vysledky.filter(r => r.t > me.t);
    const place = above.length + 1;
    if (!above.length) return `Na <b>${esc(shortMeet(m.nazev))}</b> (${dmy(m.datum)}) bys s ${kg(me.t)} vyhrála kategorii ${esc(myWc())} kg!`;
    const next = above[above.length - 1];
    return `Na <b>${esc(shortMeet(m.nazev))} ${m.datum.slice(0, 4)}</b> bys byla <b>${place}.</b> Na ${next.misto}. místo chybí <b>${n1(next.t - me.t + 2.5)} kg</b>.`;
  }
  function vComp() {
    if (st.cmpErr) return `<section class="card"><p class="hint">Srovnávací data se nenačetla. Zkus to s internetem.</p></section>`;
    if (!st.cmp) return `<section class="card"><p class="hint">Načítám výsledky soutěží…</p></section>`;
    const me = mine(), wc = myWc(), age = st.ui.age || (isJunior() ? "junior" : "vse");
    const g = st.cmp.skupiny[`${st.ui.scope}|${wc}|${age}`];
    let h = `<section class="card"><div class="row"><h2 class="h2">Moje kategorie</h2><span class="label">${esc(wc)} kg · ${age === "junior" ? "juniorky" : "všechny"}</span></div>
      ${seg("scope", [["csst", "ČSST"], ["ipf", "IPF svět"]], st.ui.scope)}
      <div class="row">${seg("age", [["junior", "Juniorky"], ["vse", "Všechny"]], age)}${seg("wc", [["76", "76"], ["84", "84"], ["84+", "84+"]], wc)}</div>`;
    if (!g || !g.t) h += `<p class="hint">Pro tuhle kombinaci nejsou data.</p></section>`;
    else {
      h += `<p class="hint">${g.t.n} závodnic (klasický trojboj, od roku ${st.cmp.obdobi_od.slice(0, 4)}). Počítá se nejlepší výkon každé z nich.</p>`;
      for (const [m, label, val] of [["t", "Součet", me.t], ["s", "Dřep", me.s], ["b", "Bench", me.b], ["d", "Mrtvý tah", me.d], ["gl", "GL body", me.gl]]) {
        const p = g[m]; if (!p) continue;
        const pb = pctBelow(p, val);
        const nextLvl = [25, 50, 75, 90].find(l => (pb ?? 0) < l);
        const need = nextLvl != null ? p.p[nextLvl] - val : 0;
        h += `<div class="stack" style="gap:2px"><div class="row"><span><b>${label}</b> ${val ? (m === "gl" ? n1(val) : kg(val)) : "—"}</span><span class="tr-pill ${pb >= 50 ? "red" : ""}">${val ? `lepší než ${pb} %` : "chybí"}</span></div>
          <div class="tr-pbar"><span style="width:${val ? pb : 0}%"></span><i style="left:50%"></i><i style="left:75%"></i><i style="left:90%"></i></div>
          <small class="hint">${val && nextLvl != null ? `Na ${nextLvl} % chybí ${m === "gl" ? n1(need) + " bodů" : kg(Math.max(0, need))}. ` : ""}Medián ${m === "gl" ? n1(p.p[50]) : kg(p.p[50])} · top 10 % od ${m === "gl" ? n1(p.p[90]) : kg(p.p[90])}</small></div>`;
      }
      h += `</section>`;
    }
    h += vWhere(wc, age === "junior") + vGL() + vCut();
    h += `<p class="foot">Data z projektu OpenPowerlifting (openpowerlifting.org), stav k ${dmy(st.cmp.data_k)}. Bez jmen, jen čísla.</p>`;
    return h;
  }
  function vWhere(wc, junior) {
    const me = mine();
    const ms = meetsFor(wc, junior).sort((a, b) => (/České republiky/.test(b.nazev) - /České republiky/.test(a.nazev)) || b.datum.localeCompare(a.datum)).slice(0, 8);
    if (!ms.length) return "";
    const rows = ms.map(m => {
      const above = me.t ? m.vysledky.filter(r => r.t > me.t).length : 0, N = m.vysledky.length + 1;
      const win = m.vysledky[0]?.t || 0;
      return `<div class="tr-w" style="grid-template-columns:52px 1fr auto"><span class="d">${me.t ? above + 1 : "–"}<small>z ${N}</small></span><span class="n"><b>${esc(shortMeet(m.nazev))}</b><span>${dmy(m.datum)} · ${m.divize === "Juniors" ? "juniorky" : "ženy"} · vítězka ${kg(win)}</span></span>${me.t && above === 0 ? `<span class="pr">ZLATO</span>` : ""}</div>`;
    }).join("");
    return `<section class="card"><div class="row"><h2 class="h2">Kde bych skončila?</h2><span class="label">${me.t ? kg(me.t) : "bez součtu"}</span></div>${chase() ? `<p class="tr-tip">${chase()}</p>` : ""}<div class="tr-list">${rows}</div><p class="hint">Tvůj součet nejlepších singlů vložený do skutečných výsledků ČSST v kategorii ${esc(wc)} kg.</p></section>`;
  }
  function vGL() {
    const c = calc(), ev = [];
    for (const k of ["S", "B", "D"]) { const s = c.series.get(k); if (s) for (const ses of s.sessions) ev.push({ d: ses.date, k, kg: Math.max(...ses.sets.map(x => x.kg)) }); }
    ev.sort((a, b) => a.d.localeCompare(b.d));
    const run = { S: 0, B: 0, D: 0 }, pts = []; let last = 0;
    for (const e of ev) {
      if (e.kg > run[e.k]) run[e.k] = e.kg; else continue;
      if (run.S && run.B && run.D) { const t = run.S + run.B + run.D, g = gl(t, bwAt(e.d)); if (Math.abs(g - last) > .05) { pts.push({ x: parseDs(e.d).getTime(), y: Math.round(g * 10) / 10, pr: true, tip: `${dmy(e.d)}: ${n1(g)} GL (součet ${kg(t)})` }); last = g; } }
    }
    const me = mine();
    return `<section class="card"><div class="row"><h2 class="h2">IPF GL body</h2><span class="label">${me.gl ? n1(me.gl) + " teď" : ""}</span></div><p class="hint">Oficiální body IPF, které srovnávají ženy napříč váhovkami. Rostou se silou a při stejné síle i s nižší vahou.</p>${lineChart(pts, "#E0242B", "GL body v čase")}</section>`;
  }
  function vCut() {

    const now = win(0, 42), before = win(42, 84);

  function milestones() {
    const out = [], hit = {}, run = { S: 0, B: 0, D: 0 };
    const add = (id, label, big, small) => out.push({ id, label, big, small });
    for (const v of [60, 80, 100, 120, 140]) add("S" + v, "Dřep", v, "kg");
    for (const v of [40, 50, 60, 70, 80, 100]) add("B" + v, "Bench", v, "kg");
    for (const v of [80, 100, 120, 140, 160, 180]) add("D" + v, "Mrtvý tah", v, "kg");
    for (const v of [250, 300, 350, 400, 450, 500]) add("T" + v, "Součet", v, "kg");
    for (const [k, m] of [["S", 1], ["S", 1.5], ["S", 2], ["B", .75], ["B", 1], ["D", 1.5], ["D", 2], ["D", 2.5]]) add(`X${k}${m}`, MOVES[k], fmt(m, 2) + "×", "tělesná váha");
    for (const v of [40, 50, 60, 70]) add("G" + v, "GL body", v, "bodů");
    for (const v of [25, 50, 100, 200, 365]) add("N" + v, "Tréninků", v, "celkem");
    for (const v of [4, 8, 12, 26]) add("W" + v, "Týdnů v řadě", v, "3+ tréninky");
    const weeks = {};
    st.ws.forEach((w, i) => {
      for (const e of w.cviky || []) { const cat = catOf(e); if (run[cat] !== undefined) for (const x of workSets(e)) if (x.kg > run[cat]) run[cat] = x.kg; }
      const d = w.datum, bw = bwAt(d), t = run.S && run.B && run.D ? run.S + run.B + run.D : 0;
      const mark = id => { if (!hit[id]) hit[id] = d; };
      for (const k of ["S", "B", "D"]) { out.filter(o => o.id[0] === k && run[k] >= o.big).forEach(o => mark(o.id)); for (const o of out.filter(o => o.id[0] === "X" && o.id[1] === k)) if (bw && run[k] >= parseFloat(o.id.slice(2)) * bw) mark(o.id); }
      out.filter(o => o.id[0] === "T" && t >= o.big).forEach(o => mark(o.id));
      out.filter(o => o.id[0] === "G" && gl(t, bw) >= o.big).forEach(o => mark(o.id));
      out.filter(o => o.id[0] === "N" && i + 1 >= o.big).forEach(o => mark(o.id));
      const wk = wkStart(d); weeks[wk] = (weeks[wk] || 0) + 1;
      let streak = 0, cur = wk; while ((weeks[cur] || 0) >= 3) { streak++; cur = addDays(cur, -7); }
      out.filter(o => o.id[0] === "W" && streak >= o.big).forEach(o => mark(o.id));
    });
    return out.map(o => ({ ...o, date: hit[o.id] }));
  }

      p.innerHTML = head("Hotovo!") + `<div class="sheet-body stack">
        <div class="stats"><div><small>Čas</small><b>${d.trvani} min</b></div><div><small>Série</small><b>${sets}</b></div><div><small>Odtaháno</small><b>${fmt(ton / 1000, 1)} t</b></div></div>
        ${s.prs.length ? `<section class="card tr-hero"><span class="label">Nové rekordy</span>${s.prs.map(x => `<h3 class="h2">${esc(x)}</h3>`).join("")}</section>` : `<p class="hint">Další cihla do zdi. Rekordy přijdou.</p>`}
        <div class="field"><label for="tr-tpl-n">Uložit jako šablonu</label><div class="row" style="flex-wrap:nowrap"><input class="input" id="tr-tpl-n" value="${esc(d.nazev)}"><button class="btn" data-t="save-tpl" data-id="${esc(s.id)}">Uložit</button></div></div>
        <button class="btn redb block" data-t="sheet-close">Zavřít</button></div>`;
      return;
    }
    if (s.type === "workout") {
      const w = st.ws.find(x => x.id === s.id); if (!w) { closeSheet(); return; }
      p.innerHTML = head(esc(w.nazev || "Trénink")) + `<div class="sheet-body stack">
        <p class="hint">${dmy(w.datum)} · ${esc(w.cas || "")}${w.trvani ? " · " + w.trvani + " min" : ""}${w.zdroj === "lyfta" ? " · z Lyfty" : ""}</p>
        ${(w.cviky || []).map(e => `<section class="card tr-ex"><div class="tr-ex-head" style="grid-template-columns:44px 1fr">${thumb(e)}<div><h3>${esc(exName(e))}</h3></div></div>
          <p class="hint" style="color:var(--ink-2)">${e.serie.map(x => x.min || x.km ? `${x.min ? n1(x.min) + " min" : ""}${x.km ? " " + n1(x.km) + " km" : ""}` : `${x.r ? "R " : ""}${n1(x.kg)}×${x.op}${x.rir != null ? "@" + x.rir : ""}${x.neuspech ? " ✗" : ""}`).join(" · ")}</p></section>`).join("")}
        ${w.pozn ? `<p class="est">${esc(w.pozn)}</p>` : ""}
        <div class="row"><button class="btn" data-t="repeat" data-id="${esc(w.id)}">Zopakovat</button><button class="btn" data-t="w-edit" data-id="${esc(w.id)}">Upravit</button><button class="btn ghost" data-t="w-del" data-id="${esc(w.id)}">${s.confirmDel ? "Opravdu smazat?" : "Smazat"}</button></div></div>`;
      return;
    }
    if (s.type === "all") {
      p.innerHTML = head("Všechny tréninky") + `<div class="sheet-body"><div class="tr-list">${[...st.ws].reverse().map(wRow).join("")}</div></div>`;
      return;
    }
    if (s.type === "ex") {
      const ser = calc().series.get(s.k); if (!ser) { closeSheet(); return; }
      const best = calc().pr.get(s.k).best;
      p.innerHTML = head(esc(ser.label)) + `<div class="sheet-body stack">${thumb(ser.ex, true)}
        <div class="stats">${[1, 3, 5].map(n => `<div><small>Rekord ${n} op.</small><b>${best[n] ? n1(best[n].kg) : "—"}</b><small>${best[n] ? dmy(best[n].date) : ""}</small></div>`).join("")}</div>
        <div class="tr-list">${[...ser.sessions].reverse().slice(0, 10).map(ses => `<div class="row"><span class="hint">${dmy(ses.date)}</span><span>${ses.sets.map(x => `${n1(x.kg)}×${x.op}`).join(" · ")}${ses.pr ? ` <b class="red">PR</b>` : ""}</span></div>`).join("")}</div></div>`;
      return;
    }
    if (s.type === "ex-menu") {
      const e = st.active?.cviky[s.e]; if (!e) { closeSheet(); return; }
      p.innerHTML = head(esc(exName(e))) + `<div class="sheet-body stack">
        <button class="btn" data-t="ex-move" data-e="${s.e}" data-d="-1" ${s.e === 0 ? "disabled" : ""}>Posunout nahoru</button>
        <button class="btn" data-t="ex-move" data-e="${s.e}" data-d="1" ${s.e === st.active.cviky.length - 1 ? "disabled" : ""}>Posunout dolů</button>
        <button class="btn" data-t="ex-swap" data-e="${s.e}">Vyměnit za jiný cvik</button>
        <button class="btn ghost" data-t="ex-del" data-e="${s.e}">Odebrat z tréninku</button></div>`;
    }
  }

  /* ---------- události ---------- */
  function addExercise(id) {
    const x = lib().get(id) || st.custom[id]; if (!x || !st.active) return;
    const e = { id: x.id, nazev: x.nazev, serie: prefillFrom({ id: x.id }) };
    if (st.sheet?.swap != null) st.active.cviky[st.sheet.swap] = e; else st.active.cviky.push(e);
    persist(); closeSheet(); render();
  }
  function startFromWorkout(w) {
    newActive(w.nazev, (w.cviky || []).map(e => ({ id: e.id, nazev: e.nazev, serie: prefillFrom(e, e.serie.length) })));
  }
  function setVal(t) {
    const a = st.active; if (!a) return;
    const e = a.cviky[+t.dataset.e], s = e?.serie[+t.dataset.s]; if (!s) return;
    s[t.dataset.tIn] = t.value.replace(",", ".");
    persist();
  }
  async function importFile(file) {
    try {
      const j = JSON.parse(await file.text());
      const docs = (j.docs || []).filter(d => d && typeof d.path === "string" && /^trenink(-nastaveni|-cviky|-sablony)?\//.test(d.path) && d.data);
      if (!docs.length) { toast("V souboru nejsou žádné tréninky."); return; }
      const have = new Set(st.ws.map(w => "trenink/" + w.id));
      let n = 0;
      setStatus("saving", `Nahrávám ${docs.length}…`);
      for (const d of docs) {
        if (have.has(d.path)) {
          // už nahraný trénink z Lyfty: doplnit jen chybějící poznámku a délku
          const cur = st.ws.find(w => "trenink/" + w.id === d.path), add = {};
          if (cur && cur.zdroj === "lyfta") { if (!cur.pozn && d.data.pozn) add.pozn = d.data.pozn; if (!cur.trvani && d.data.trvani) add.trvani = d.data.trvani; }
          if (Object.keys(add).length) { await st.db.doc(d.path).update(add); n++; }
          continue;
        }
        if (d.path === "trenink-nastaveni/profil") { await st.db.doc(d.path).set({ ...d.data, ...st.cfg }); continue; }
        await st.db.doc(d.path).set(d.data); n++;
      }
      setStatus("saved", "Uloženo");
      toast(`Nahráno ${n} záznamů.`);
    } catch (e) { console.error(e); toast("Tenhle soubor neumím načíst."); }
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-t]"); if (!b) return;
    const t = b.dataset.t, a = st.active;
    const A = {
      ui: () => { const k = b.dataset.k, v = ["progReps", "ratioReps"].includes(k) ? +b.dataset.v : b.dataset.v; if (k === "mode") st.mode = v; else if (k === "statMode") st.statMode = v; else st.ui[k] = v; render(); },
      "open-active": () => { st.mode = "aktivni"; render(); window.scrollTo(0, 0); },
      back: () => { st.mode = "dnes"; render(); },
      start: () => newActive("", []),
      "start-tpl": () => { const tp = st.tpl[b.dataset.id]; if (tp) newActive(tp.nazev, (tp.cviky || []).map(x => ({ id: x.id, nazev: x.nazev, serie: prefillFrom(x, x.serie || 3) }))); },
      repeat: () => { const w = st.ws.find(x => x.id === b.dataset.id); if (!w) return; if (a) { toast("Nejdřív dokonči rozdělaný trénink."); return; } closeSheet(); startFromWorkout(w); },
      wk: () => { st.ui.weekBack = Math.max(0, st.ui.weekBack + +b.dataset.d); render(); },
      heat: () => { st.ui.heatBack = Math.max(0, (st.ui.heatBack || 0) + +b.dataset.d); render(); },
      "add-ex": () => openSheet({ type: "pick", q: "" }),
      pick: () => addExercise(b.dataset.id),
      "new-ex": async () => {
        const n = q("#tr-new-n").value.trim(); if (!n) { toast("Napiš název cviku."); return; }
        let id = "v-" + slug(n); while (lib().has(id) && !st.custom[id]) id += "-2";
        const x = { nazev: n, cz: n, partie: q("#tr-new-p").value, typ: q("#tr-new-t").value, kat: q("#tr-new-k").value };
        st.custom[id] = { ...x, id, vlastni: true };
        st.db.doc("trenink-cviky/" + id).set(x);
        addExercise(id);
      },
      "set-add": () => { const ex = a.cviky[+b.dataset.e], l = ex.serie[ex.serie.length - 1] || {}; ex.serie.push({ kg: l.kg || "", op: l.op || "", min: l.min, km: l.km }); persist(); render(); },
      "set-del": () => { a.cviky[+b.dataset.e].serie.pop(); persist(); render(); },
      "set-r": () => { const s = a.cviky[+b.dataset.e].serie[+b.dataset.s]; s.r = !s.r; persist(); render(); },
      "set-done": () => {
        const ex = a.cviky[+b.dataset.e], j = +b.dataset.s, s = ex.serie[j];
        s.hotovo = !s.hotovo;
        if (s.hotovo) {
          const k = catOf(ex), key = MOVES[k] ? k : ex.id, w = num(s.kg), r = Math.round(num(s.op));
          const prev = a.cviky.filter(x => (MOVES[catOf(x)] ? catOf(x) : x.id) === key).flatMap(x => x.serie.filter(y => y !== s && y.hotovo && !y.r).map(y => ({ kg: num(y.kg), op: Math.round(num(y.op)) })));
          s.pr = !s.r && w > 0 && r > 0 && (calc().series.get(key)?.sessions.length || 0) > 0 && w > bestBefore(key, r, prev);
          if (s.pr) burst(`${exName(ex)}`, `${n1(w)} × ${r}`);
          const sec = MOVES[k[0]] && k !== "other" ? (+st.cfg.pauzaHlavni || 180) : (+st.cfg.pauzaOstatni || 90);
          st.rest = { end: Date.now() + sec * 1000, total: sec };
        } else s.pr = false;
        persist(); render(); tick();
      },
      "rest-plus": () => { if (st.rest) { st.rest.end += 30000; st.rest.total += 30; st.rest.buzzed = false; tick(); } },
      "rest-stop": () => { st.rest = null; tick(); },
      "ex-menu": () => openSheet({ type: "ex-menu", e: +b.dataset.e }),
      "ex-move": () => { const i = +b.dataset.e, j = i + +b.dataset.d; [a.cviky[i], a.cviky[j]] = [a.cviky[j], a.cviky[i]]; persist(); closeSheet(); render(); },
      "ex-swap": () => openSheet({ type: "pick", q: "", swap: +b.dataset.e }),
      "ex-del": () => { a.cviky.splice(+b.dataset.e, 1); persist(); closeSheet(); render(); },
      finish: () => finish(),
      cancel: () => {
        if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Opravdu? Klepni znovu"; return; }
        st.db.doc("trenink-aktivni/aktualni").delete(); st.active = null; st.rest = null; lsSet(LSK(), null); st.mode = "dnes"; render();
      },
      "w-open": () => openSheet({ type: "workout", id: b.dataset.id }),
      "w-edit": () => {
        if (a) { toast("Nejdřív dokonči rozdělaný trénink."); return; }
        const w = st.ws.find(x => x.id === b.dataset.id); if (!w) return;
        closeSheet();
        st.active = { id: w.id, upravuji: true, start: tsOf(w), datum: w.datum, cas: w.cas, trvani: w.trvani, zdroj: w.zdroj, lyftaId: w.lyftaId, nazev: w.nazev, pozn: w.pozn || "", cviky: JSON.parse(JSON.stringify(w.cviky || [])).map(e => ({ ...e, serie: e.serie.map(s => ({ ...s, hotovo: true })) })) };
        st.mode = "aktivni"; persist(true); render(); window.scrollTo(0, 0);
      },
      "w-del": () => { if (!st.sheet.confirmDel) { st.sheet.confirmDel = true; renderSheet(); return; } st.db.doc("trenink/" + b.dataset.id).delete(); closeSheet(); toast("Trénink smazán."); },
      "all-ws": () => openSheet({ type: "all" }),
      "ex-open": () => openSheet({ type: "ex", k: b.dataset.k }),
      "sheet-close": () => closeSheet(),
      "save-tpl": () => { const w = st.ws.find(x => x.id === b.dataset.id) || st.sheet?.doc; const n = q("#tr-tpl-n").value.trim() || "Šablona"; st.db.doc("trenink-sablony/" + slug(n)).set({ nazev: n, cviky: (w?.cviky || []).map(e => ({ id: e.id, nazev: e.nazev, serie: e.serie.length })) }); toast("Šablona uložená."); closeSheet(); },
      "tpl-del": () => { st.db.doc("trenink-sablony/" + b.dataset.id).delete(); },
      "save-cfg": () => {
        const v = id => q(id).value.trim();
        st.db.doc("trenink-nastaveni/profil").set({ ...st.cfg, narozen: num(v("#tr-s-y")) || "", vahovka: v("#tr-s-wc"), cilVaha: num(v("#tr-s-cv")) || "", cilTreninku: num(v("#tr-s-n")) || 4, pauzaHlavni: num(v("#tr-s-ph")) || 180, pauzaOstatni: num(v("#tr-s-po")) || 90, rir: v("#tr-s-rir") === "" ? 2 : num(v("#tr-s-rir")) });
        toast("Uloženo.");
      },
      "save-comp": () => { st.db.doc("trenink-nastaveni/profil").set({ ...st.cfg, soutez: { datum: q("#tr-c-d").value, nazev: q("#tr-c-n").value.trim() } }); toast("Soutěž uložená."); },
    };
    if (A[t]) { e.preventDefault(); A[t](); }
  });
  document.addEventListener("input", e => {
    const t = e.target; if (!t.dataset || !t.dataset.tIn) return;
    const k = t.dataset.tIn;
    if (k === "pick-q") { st.sheet.q = t.value; st.sheet.focus = true; renderSheet(); return; }
    if (k === "name" && st.active) { st.active.nazev = t.value; persist(); return; }
    if (k === "note" && st.active) { st.active.pozn = t.value; persist(); return; }
    setVal(t);
  });
  document.addEventListener("change", e => {
    const t = e.target; if (!t.dataset || !t.dataset.tCh) return;
    if (t.dataset.tCh === "import" && t.files?.[0]) importFile(t.files[0]);
    if (t.dataset.tCh === "map") { const m = { ...(st.cfg.mapping || {}), [t.dataset.id]: t.value }; st.db.doc("trenink-nastaveni/profil").set({ ...st.cfg, mapping: m }); }
  });
  function burst(title, val) {
    const d = document.createElement("div"); d.className = "tr-pr-burst";
    d.innerHTML = `<i class="tr-sweep"></i><div><small>NOVÝ REKORD</small><b class="tr-chrome">${esc(val)}</b><span>${esc(title)}</span></div>`;
    document.body.appendChild(d); try { navigator.vibrate?.([60, 40, 120]); } catch (e) { /* nic */ }
    setTimeout(() => d.remove(), 2700);
  }

  return { init, shell, render, st, _calc: calc, _milestones: milestones };
})();
</script>
<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(console.error));
</script>
</body>
</html>
